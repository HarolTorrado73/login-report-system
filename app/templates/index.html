<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Report System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>

    <div class="container">

        <h1>Login Report System</h1>

        {% for machine, users in report.items() %}

            <div class="machine-card">

                <h2>{{ machine }}</h2>

                <ul>
                    {% for user in users %}
                        <li>{{ user }}</li>
                    {% endfor %}
                </ul>

            </div>

        {% endfor %}

    </div>

</body>
</html>
