{% extends "base.html" %}

{% block title %}
Iniciar Sesion
{% endblock %}

{% block content %}

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-header">
            <h1>Bienvenido</h1>
            <p>Inicie sesion para acceder al panel de monitoreo.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">

            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ request.form.get('username', '') }}"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Contrasena</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Iniciar Sesion
            </button>

        </form>

        <div class="login-footer">
            <small>
                Credenciales de prueba:<br>
                <strong>admin</strong> / <strong>admin123</strong><br>
                <strong>analyst</strong> / <strong>analyst123</strong>
            </small>
        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
{% endblock %}
